name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      # 3.13 dropped: the PGPy dep (via remailers carrier crypto) imports
      # the stdlib `imghdr` module, removed in Python 3.13.
      python_versions: '["3.10", "3.11", "3.12"]'
      install_extras: 'test'
      test_path: 'tests'
